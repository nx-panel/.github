name: Bug report
description: Something in the Panel or a Node is not doing what it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **If this is a security vulnerability, stop here** and
        [open a private advisory](https://github.com/Nexora-VPN/.github/security/advisories/new)
        instead. Issues are public from the moment they are created.

        **Redact secrets** from anything you paste. Subscription URLs, install
        and setup tokens, licence keys, private keys and database DSNs are all
        credentials. Replace them with `REDACTED` — trimming a few characters
        off the end is not enough.

  - type: dropdown
    id: component
    attributes:
      label: Which component
      options:
        - Panel
        - Node
        - Both, or not sure
        - Installer (install.sh or the node installer)
        - Subscription links or the subscription page
    validations:
      required: true

  - type: input
    id: panel-version
    attributes:
      label: Panel version
      description: "`nexora-panel version`, or the image tag."
      placeholder: "v1.2.3"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: >-
        `nexora-node version`, or the image tag. Panel and Node are released
        separately, so their versions differ. Leave blank if no node is involved.
      placeholder: "v1.1.0"

  - type: dropdown
    id: install-method
    attributes:
      label: How it is installed
      options:
        - Install script (install.sh)
        - Docker / Docker Compose
        - By hand from a release archive
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Debian 12, amd64"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Start from a working install and list what you did. If it only happens on
        your configuration, say what is unusual about it.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The lines around the failure, not the whole file.
        `journalctl -u nexora-panel -n 100 --no-pager`,
        `journalctl -u nexora-node -n 100 --no-pager`, or
        `docker compose logs --tail 100`. This is rendered as a code block, so no
        backticks are needed — but it is not redacted for you.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed every token, key, subscription URL and password from what I pasted.
          required: true
        - label: I searched the existing issues and this is not one of them.
          required: true
        - label: This is one problem, not several.
          required: true
